apiVersion: apps/v1
kind: Deployment
metadata:
  name: odgj-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: odgj-app
  template:
    metadata:
      labels:
        app: odgj-app
    spec:
      containers:
        - name: app
          image: odgj-street-coffee:latest
          ports:
            - containerPort: 3000
          env:
            - name: PGHOST
              value: postgres
            - name: REDIS_URL
              value: redis://redis:6379
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: odgj-app
spec:
  selector:
    app: odgj-app
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
